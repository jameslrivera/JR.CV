<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hong Kong — James Rivera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#030712;font-family:'Geist',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{padding:16px}
@media (min-width:768px){.wrap{padding:64px}}
.col{max-width:900px;margin:0 auto}
.back{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:rgba(3,7,18,.8);display:inline-flex;align-items:center;gap:6px;margin-bottom:32px}
.back:hover{text-decoration:underline}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{margin:0;font-weight:700;font-size:30px;line-height:36px;letter-spacing:-.025em}
.date{font-size:14px;color:#6b7280;font-variant-numeric:tabular-nums;white-space:nowrap}
.grid{columns:3 260px;column-gap:12px}
.grid img{width:100%;margin:0 0 12px;border-radius:8px;border:1px solid #f3f4f6;display:block;cursor:zoom-in;transition:transform .2s,box-shadow .2s}
.grid img:hover{transform:translateY(-2px);box-shadow:0 1px 2px 0 rgba(0,0,0,.05)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;z-index:10}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="col">
    <a class="back" href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back</a>
    <div class="head">
      <h1>Hong Kong</h1>
      <span class="date">Jun 2025</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<div class="lb" id="lb"><img id="lbimg" src="" alt=""></div>
<script>
(function(){
  var n=1, grid=document.getElementById('grid');
  for(var i=1;i<=n;i++){
    var src='images/hongkong/hongkong-'+String(i).padStart(2,'0')+'.jpg';
    var im=document.createElement('img');
    im.src=src; im.loading='lazy'; im.alt='Hong Kong photo '+i;
    im.onclick=(function(s){return function(){document.getElementById('lbimg').src=s;document.getElementById('lb').classList.add('open');};})(src);
    grid.appendChild(im);
  }
  var lb=document.getElementById('lb');
  lb.onclick=function(){lb.classList.remove('open');document.getElementById('lbimg').src='';};
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){lb.classList.remove('open');}});
})();
</script>
</body>
</html>
