<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taiwan — James Rivera</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#ffffff;font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Monaco,'Cascadia Code','Roboto Mono',monospace;color:#3f3f46;-webkit-font-smoothing:antialiased}
h1,.sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif}
a{color:#3f3f46;text-decoration:none;border-bottom:1px solid transparent}
a:hover{color:#18181b;border-bottom-color:#18181b}
.wrap{width:100%;display:flex;flex-direction:column;align-items:center;padding:56px 24px 96px}
.col{width:100%;max-width:900px}
.back{font-size:13px;display:inline-flex;align-items:center;gap:6px;margin-bottom:28px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:24px}
h1{margin:0;font-weight:700;font-size:30px;letter-spacing:-0.02em;color:#09090b}
.date{font-size:13px;color:#71717a;white-space:nowrap}
.grid{columns:3 260px;column-gap:12px}
.grid img{width:100%;margin:0 0 12px;border-radius:10px;border:1px solid #e4e4e7;display:block;cursor:zoom-in;transition:opacity .2s}
.grid img:hover{opacity:.9}
.lb{position:fixed;inset:0;background:rgba(9,9,11,.92);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;z-index:10}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="col">
    <a class="back" href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back</a>
    <div class="head">
      <h1>Taiwan</h1>
      <span class="date">Jan - Jun 2025</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<div class="lb" id="lb"><img id="lbimg" src="" alt=""></div>
<script>
(function(){
  var n=10, grid=document.getElementById('grid');
  for(var i=1;i<=n;i++){
    var src='images/taiwan/taiwan-'+String(i).padStart(2,'0')+'.jpg';
    var im=document.createElement('img');
    im.src=src; im.loading='lazy'; im.alt='Taiwan photo '+i;
    im.onclick=(function(s){return function(){document.getElementById('lbimg').src=s;document.getElementById('lb').classList.add('open');};})(src);
    grid.appendChild(im);
  }
  var lb=document.getElementById('lb');
  lb.onclick=function(){lb.classList.remove('open');document.getElementById('lbimg').src='';};
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){lb.classList.remove('open');}});
})();
</script>
</body>
</html>
